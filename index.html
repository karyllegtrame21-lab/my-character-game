<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Meowple Rush</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            background:
                    linear-gradient(
                            135deg,
                            #fff4df,
                            #ffe9e9
                    );

            color: #5b351d;

            text-align: center;

            overflow-x: hidden;

            overscroll-behavior: none;

        }


        /* =====================================================
           MAIN PAGE
        ===================================================== */

        #page {

            width: 100%;

            max-width: 1100px;

            margin: auto;

            padding:
                    12px
                    14px
                    18px;

        }


        /* =====================================================
           TITLE
        ===================================================== */

        #gameTitle {

            margin:
                    3px
                    0
                    8px;

            font-size:
                    clamp(
                            30px,
                            6vw,
                            62px
                    );

            font-weight: 900;

            color: #603719;

            text-shadow:
                    2px 3px 0 #fff,
                    4px 5px 0 #d99b58;

            letter-spacing: 1px;

        }


        .titleCat {
            display: inline-block;
        }


        /* =====================================================
           SCORE CARDS
        ===================================================== */

        #gameInfo {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 10px;

            width: 100%;

            margin:
                    8px
                    auto
                    12px;

        }


        .statCard {

            background:
                    rgba(
                            255,
                            250,
                            238,
                            0.95
                    );

            border:
                    3px solid #f0d39d;

            border-radius: 18px;

            padding:
                    7px
                    5px;

            min-height: 65px;

            box-shadow:
                    0 5px 0 #d8b477,
                    0 8px 14px
                    rgba(
                            120,
                            78,
                            35,
                            0.12
                    );

        }


        .statLabel {

            display: block;

            font-size:
                    clamp(
                            14px,
                            2.5vw,
                            20px
                    );

            font-weight: bold;

        }


        .statValue {

            display: block;

            margin-top: 2px;

            font-size:
                    clamp(
                            21px,
                            4vw,
                            32px
                    );

            font-weight: 900;

        }


        #score {
            color: #619c38;
        }


        #lives {
            color: #e95d55;
        }


        #round {
            color: #e79a22;
        }


        /* =====================================================
           GAME FIELD
        ===================================================== */

        #game {

            position: relative;

            width: 100%;

            height: min(
                    61vh,
                    650px
            );

            min-height: 410px;

            margin:
                    0
                    auto;

            overflow: hidden;

            border:
                    7px solid #6d9d39;

            border-radius: 32px;

            background:

                    linear-gradient(
                            135deg,
                            #b7df5d,
                            #d7ed76
                    );

            box-shadow:

                    inset
                    0 0 0 3px
                    #9bc957,

                    0 8px 0 #d2b47a,

                    0 12px 25px
                    rgba(
                            72,
                            55,
                            20,
                            0.15
                    );

            touch-action: none;

        }


        /* Decorative garden */

        #game::before {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                    radial-gradient(
                            circle at 15% 20%,
                            rgba(
                                    255,
                                    255,
                                    255,
                                    0.5
                            )
                            0 3px,
                            transparent 4px
                    ),

                    radial-gradient(
                            circle at 75% 30%,
                            rgba(
                                    255,
                                    255,
                                    255,
                                    0.4
                            )
                            0 3px,
                            transparent 4px
                    );

            background-size:
                    80px 80px,
                    100px 100px;

            opacity: 0.6;

        }


        /* =====================================================
           CAT
        ===================================================== */

        #cat {

            position: absolute;

            width: 58px;

            height: 58px;

            font-size: 49px;

            line-height: 58px;

            text-align: center;

            user-select: none;

            z-index: 20;

            filter:
                    drop-shadow(
                            0 3px 2px
                            rgba(
                                    0,
                                    0,
                                    0,
                                    0.18
                            )
                    );

        }


        /* =====================================================
           APPLES
        ===================================================== */

        .apple {

            position: absolute;

            width: 38px;

            height: 38px;

            font-size: 32px;

            line-height: 38px;

            text-align: center;

            user-select: none;

            z-index: 8;

            animation:
                    applePop
                    0.25s
                    ease-out;

            filter:
                    drop-shadow(
                            0 3px 2px
                            rgba(
                                    80,
                                    40,
                                    10,
                                    0.2
                            )
                    );

        }


        @keyframes applePop {

            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }


        /* =====================================================
           SNAKES
        ===================================================== */

        .snake {

            position: absolute;

            width: 40px;

            height: 30px;

            font-size: 28px;

            line-height: 30px;

            text-align: center;

            user-select: none;

            z-index: 10;

            filter:
                    drop-shadow(
                            0 3px 2px
                            rgba(
                                    40,
                                    60,
                                    10,
                                    0.25
                            )
                    );

            transition:
                    transform
                    0.05s
                    linear;

        }


        /* =====================================================
           START / ROUND / GAME OVER OVERLAYS
        ===================================================== */

        .overlay {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding:
                    25px;

            z-index: 100;

            background:
                    rgba(
                            255,
                            248,
                            237,
                            0.94
                    );

            backdrop-filter:
                    blur(3px);

        }


        .overlayCard {

            width:
                    min(
                            90%,
                            560px
                    );

            background:
                    #fff6e5;

            border:
                    3px solid #f0cf91;

            border-radius: 30px;

            padding:
                    25px
                    22px;

            box-shadow:

                    0 7px 0 #d8a75e,

                    0 15px 25px
                    rgba(
                            100,
                            60,
                            20,
                            0.16
                    );

        }


        .overlay h2 {

            margin:
                    0
                    0
                    18px;

            color: #62391e;

            font-size:
                    clamp(
                            25px,
                            5vw,
                            40px
                    );

        }


        .overlay p {

            margin:
                    10px 0;

            font-size:
                    clamp(
                            16px,
                            3vw,
                            21px
                    );

            line-height: 1.45;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        button {

            font-family: inherit;

        }


        .gameButton,
        #restart,
        #pauseButton {

            border: none;

            color: white;

            background:
                    linear-gradient(
                            #a86d38,
                            #865020
                    );

            border-radius: 18px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:

                    0 5px 0 #633816,

                    0 9px 18px
                    rgba(
                            90,
                            45,
                            15,
                            0.2
                    );

            transition:
                    transform
                    0.1s;

        }


        .gameButton {

            margin-top: 18px;

            padding:
                    14px
                    32px;

            font-size:
                    20px;

        }


        .gameButton:active,
        #restart:active,
        #pauseButton:active {

            transform:
                    translateY(4px);

            box-shadow:
                    0 1px 0 #633816;

        }


        /* =====================================================
           CONTROL BAR
        ===================================================== */

        #actionButtons {

            display: flex;

            justify-content: center;

            gap: 18px;

            margin:
                    15px
                    auto
                    12px;

        }


        #restart,
        #pauseButton {

            min-width: 220px;

            padding:
                    13px
                    20px;

            font-size:
                    18px;

        }


        /* =====================================================
           MOBILE CONTROLS
        ===================================================== */

        #mobileControls {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            width:
                    min(
                            100%,
                            390px
                    );

            margin:
                    8px
                    auto
                    10px;

            padding:
                    8px
                    12px;

            background:
                    rgba(
                            255,
                            239,
                            202,
                            0.85
                    );

            border:
                    3px solid #edce91;

            border-radius: 28px;

            box-shadow:
                    0 5px 0 #d6b77b;

            user-select: none;

        }


        .control-row {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 22px;

        }


        #mobileControls button {

            width: 82px;

            height: 68px;

            margin: 5px;

            border:
                    3px solid #e9d7ae;

            border-radius: 20px;

            background:
                    linear-gradient(
                            #fffdf7,
                            #fff7e8
                    );

            color: #579b32;

            font-size: 38px;

            font-weight: 900;

            box-shadow:

                    0 5px 0 #b7a36d,

                    0 7px 12px
                    rgba(
                            80,
                            60,
                            20,
                            0.13
                    );

            cursor: pointer;

            touch-action: none;

            -webkit-user-select: none;

            user-select: none;

        }


        #mobileControls button:active {

            transform:
                    translateY(4px)
                    scale(0.96);

            box-shadow:
                    0 1px 0 #b7a36d;

        }


        /* =====================================================
           DISCLAIMER
        ===================================================== */

        #disclaimer {

            width:
                    min(
                            94%,
                            900px
                    );

            margin:
                    8px
                    auto
                    0;

            padding:
                    10px
                    16px;

            background:
                    rgba(
                            255,
                            246,
                            224,
                            0.95
                    );

            border:
                    3px solid #efd39d;

            border-radius: 20px;

            box-shadow:
                    0 4px 0 #d6b77c;

        }


        #disclaimerTitle {

            margin:
                    0 0 3px;

            color:
                    #699c38;

            font-size:
                    18px;

            font-weight:
                    900;

        }


        #disclaimerText {

            margin: 0;

            font-size:
                    14px;

            font-weight:
                    600;

        }


        /* =====================================================
           FIREWORKS
        ===================================================== */

        #fireworks {

            position: absolute;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 101;

        }


        .catFirework {

            position: absolute;

            font-size: 28px;

            animation:
                    catExplosion
                    1.5s
                    ease-out
                    forwards;

        }


        @keyframes catExplosion {

            0% {

                transform:
                        scale(0.2);

                opacity: 0;

            }

            25% {

                transform:
                        scale(1.4);

                opacity: 1;

            }

            100% {

                transform:
                        scale(0.8)
                        translate(
                                var(--x),
                                var(--y)
                        );

                opacity: 0;

            }

        }


        /* =====================================================
           HIDE ELEMENTS
        ===================================================== */

        #roundComplete,
        #gameOverScreen {

            display: none;

        }


        /* =====================================================
           PHONE LAYOUT
        ===================================================== */

        @media (
        max-width: 700px
        ) {

            #page {

                padding:
                        7px
                        8px
                        10px;

            }


            #gameTitle {

                font-size:
                        clamp(
                                28px,
                                8vw,
                                43px
                        );

                margin:
                        0
                        0
                        5px;

            }


            #gameInfo {

                gap: 6px;

                margin:
                        5px
                        auto
                        7px;

            }


            .statCard {

                min-height: 51px;

                padding:
                        4px
                        2px;

                border-width: 2px;

                border-radius: 14px;

                box-shadow:
                        0 3px 0 #d8b477;

            }


            .statLabel {

                font-size: 12px;

            }


            .statValue {

                font-size: 20px;

            }


            #game {

                height:
                        min(
                                49vh,
                                480px
                        );

                min-height:
                        330px;

                border-width: 5px;

                border-radius: 25px;

            }


            #cat {

                width: 48px;

                height: 48px;

                font-size: 41px;

                line-height: 48px;

            }


            .apple {

                width: 32px;

                height: 32px;

                font-size: 28px;

                line-height: 32px;

            }


            .snake {

                width: 34px;

                height: 26px;

                font-size: 25px;

                line-height: 26px;

            }


            #actionButtons {

                gap: 10px;

                margin:
                        9px
                        auto
                        7px;

            }


            #restart,
            #pauseButton {

                min-width:
                        0;

                width:
                        43%;

                padding:
                        9px
                        6px;

                font-size:
                        15px;

                border-radius:
                        14px;

            }


            #mobileControls {

                width:
                        min(
                                94%,
                                360px
                        );

                padding:
                        5px
                        8px;

                margin:
                        5px
                        auto
                        7px;

                border-radius:
                        22px;

            }


            .control-row {

                gap: 15px;

            }


            #mobileControls button {

                width: 72px;

                height: 58px;

                margin: 3px;

                font-size: 32px;

                border-radius: 17px;

            }


            #disclaimer {

                margin-top:
                        5px;

                padding:
                        7px
                        10px;

                border-radius:
                        15px;

            }


            #disclaimerTitle {

                font-size:
                        15px;

            }


            #disclaimerText {

                font-size:
                        12px;

            }


            .overlay {

                padding:
                        12px;

            }


            .overlayCard {

                width:
                        90%;

                padding:
                        18px
                        13px;

                border-radius:
                        22px;

            }


            .overlay h2 {

                margin-bottom:
                        10px;

                font-size:
                        24px;

            }


            .overlay p {

                margin:
                        6px 0;

                font-size:
                        15px;

            }


            .gameButton {

                margin-top:
                        10px;

                padding:
                        11px
                        25px;

                font-size:
                        17px;

            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (
        max-height: 700px
        ) and (
        max-width: 700px
        ) {

            #gameTitle {

                font-size:
                        27px;

            }


            #game {

                height:
                        42vh;

                min-height:
                        285px;

            }


            #mobileControls {

                transform:
                        scale(0.9);

                transform-origin:
                        top center;

                margin-bottom:
                        -12px;

            }


            #disclaimer {

                transform:
                        scale(0.92);

                transform-origin:
                        top center;

                margin-bottom:
                        -5px;

            }

        }

    </style>

</head>


<body>


<div id="page">


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1 id="gameTitle">

        🐱 Meowple Rush 🍎

    </h1>


    <!-- =====================================================
         GAME INFO
    ====================================================== -->

    <div id="gameInfo">


        <div class="statCard">

            <span class="statLabel">
                🍎 Apples
            </span>

            <span class="statValue">

                <span id="score">0</span>
                /
                <span id="appleGoal">10</span>

            </span>

        </div>


        <div class="statCard">

            <span class="statLabel">
                ❤️ Lives
            </span>

            <span class="statValue">

                <span id="lives">5</span>

            </span>

        </div>


        <div class="statCard">

            <span class="statLabel">
                🏆 Round
            </span>

            <span class="statValue">

                <span id="round">1</span>

            </span>

        </div>


    </div>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <div id="game">


        <!-- CAT -->

        <div id="cat">
            🐱
        </div>


        <!-- =================================================
             START SCREEN
        ================================================== -->

        <div
                id="startScreen"
                class="overlay"
        >

            <div class="overlayCard">

                <h2>
                    🐱 Meowple Rush 🍎
                </h2>


                <p>
                    🍎 Collect all the apples!
                </p>


                <p>
                    🐍 Avoid the snakes!
                </p>


                <p>
                    ❤️ You have 5 lives.
                </p>


                <button
                        id="startButton"
                        class="gameButton"
                >
                    ▶️ START GAME
                </button>

            </div>

        </div>


        <!-- =================================================
             ROUND COMPLETE
        ================================================== -->

        <div
                id="roundComplete"
                class="overlay"
        >

            <div id="fireworks"></div>


            <div class="overlayCard">

                <h2 id="roundTitle">
                    🎉 ROUND COMPLETE! 🎉
                </h2>


                <p id="roundNote"></p>


                <p>
                    🐱💥 You survived the round! 💥🐱
                </p>


                <button
                        id="nextRoundButton"
                        class="gameButton"
                >
                    ➡️ NEXT ROUND
                </button>

            </div>

        </div>


        <!-- =================================================
             GAME OVER
        ================================================== -->

        <div
                id="gameOverScreen"
                class="overlay"
        >

            <div class="overlayCard">

                <h2>
                    💀 GAME OVER 💀
                </h2>


                <p id="gameOverNote">
                    PUYOT! 😂
                </p>


                <p id="finalRound"></p>


                <button
                        id="restartGameButton"
                        class="gameButton"
                >
                    🔄 PLAY AGAIN
                </button>

            </div>

        </div>


    </div>


    <!-- =====================================================
         ACTION BUTTONS
    ====================================================== -->

    <div id="actionButtons">


        <button id="restart">
            🔄 Restart Game
        </button>


        <button id="pauseButton">
            ⏸️ Pause
        </button>


    </div>


    <!-- =====================================================
         PHONE CONTROLS
    ====================================================== -->

    <div id="mobileControls">


        <div class="control-row">

            <button id="up">
                ⬆️
            </button>

        </div>


        <div class="control-row">

            <button id="left">
                ⬅️
            </button>


            <button id="right">
                ➡️
            </button>

        </div>


        <div class="control-row">

            <button id="down">
                ⬇️
            </button>

        </div>


    </div>


    <!-- =====================================================
         DISCLAIMER
    ====================================================== -->

    <div id="disclaimer">

        <div id="disclaimerTitle">
            🐾 Disclaimer
        </div>

        <div id="disclaimerText">
            This game is Kaligayahan ni Alegrescritora.
        </div>

    </div>


</div>


<!-- =========================================================
     IMPORTANT:
     Your JavaScript file is named iindex.js
========================================================== -->

<script src="iindex.js"></script>


</body>

</html>
