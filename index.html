<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginger Cat Apple Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff4e6;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin: 12px 0 5px;
            color: #7b3f00;
            font-size: 28px;
        }

        #gameInfo {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 20px;
            font-weight: bold;
            margin: 10px;
        }

        #game {
            position: relative;
            width: 90vw;
            max-width: 900px;
            height: 65vh;
            max-height: 600px;
            min-height: 400px;
            margin: auto;
            background: #d9f7be;
            border: 5px solid #5b8c3a;
            border-radius: 15px;
            overflow: hidden;
            touch-action: none;
        }

        /* GINGER CAT */
        #cat {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 52px;
            line-height: 60px;
            text-align: center;
            user-select: none;
            z-index: 10;
        }

        /* APPLES */
        .apple {
            position: absolute;
            width: 35px;
            height: 35px;
            font-size: 30px;
            line-height: 35px;
            text-align: center;
            user-select: none;
            z-index: 5;
        }

        /* SMALL SNAKES */
        .snake {
            position: absolute;
            width: 35px;
            height: 25px;
            font-size: 24px;
            line-height: 25px;
            text-align: center;
            user-select: none;
            z-index: 6;
        }

        /* MESSAGE */
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            padding: 25px;
            background: white;
            border: 4px solid #7b3f00;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            display: none;
            z-index: 20;
        }

        /* RESTART */
        #restart {
            margin-top: 12px;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #7b3f00;
            color: white;
            cursor: pointer;
        }

        #restart:hover {
            background: #a05200;
        }

        #instructions {
            margin: 10px auto;
            color: #555;
            font-size: 15px;
        }

        /* =========================
           PHONE CONTROLS
        ========================= */

        #mobileControls {
            display: none;
            margin: 12px auto 20px;
            width: 210px;
            user-select: none;
        }

        #mobileControls button {
            width: 60px;
            height: 60px;
            margin: 4px;
            border: none;
            border-radius: 15px;
            background: white;
            font-size: 27px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
            cursor: pointer;

            /* Important for phone touch */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #mobileControls button:active {
            transform: scale(0.92);
            background: #ddd;
        }

        /* PHONE SCREEN */
        @media (max-width: 700px) {

            body {
                overflow-y: auto;
            }

            h1 {
                font-size: 22px;
                margin-top: 8px;
            }

            #gameInfo {
                font-size: 17px;
                gap: 15px;
            }

            #game {
                width: 94vw;
                height: 55vh;
                min-height: 330px;
                border-width: 4px;
            }

            #mobileControls {
                display: block;
            }

            #instructions {
                display: none;
            }

            #restart {
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

<h1>🐱 Ginger Cat Apple Game 🍎</h1>

<div id="gameInfo">
    <div>
        🍎 Apples:
        <span id="score">0</span>/10
    </div>

    <div>
        ❤️ Lives:
        <span id="lives">5</span>
    </div>
</div>

<div id="game">

    <!-- CAT -->
    <div id="cat">🐱</div>

    <!-- WIN / GAME OVER MESSAGE -->
    <div id="message"></div>

</div>

<button id="restart">
    🔄 Restart Game
</button>

<div id="instructions">
    ⌨️ Use Arrow Keys or W A S D to move.
    <br>
    📱 On phones, hold the buttons below to move.
    <br>
    🍎 Collect 10 apples and avoid the 🐍 snakes!
</div>

<!-- =========================
     PHONE CONTROLS
========================= -->

<div id="mobileControls">

    <!-- UP -->
    <div class="control-row">
        <button id="up">⬆️</button>
    </div>

    <!-- LEFT + RIGHT -->
    <div class="control-row">
        <button id="left">⬅️</button>
        <button id="right">➡️</button>
    </div>

    <!-- DOWN -->
    <div class="control-row">
        <button id="down">⬇️</button>
    </div>

</div>

<!-- JAVASCRIPT -->
<script src="iindex.js"></script>

</body>
</html>
