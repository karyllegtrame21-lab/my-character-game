<!DOCTYPE html>
<html>
<head>
    <title>Apple Collector</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
            background: lightgreen;
            position: relative;
        }

        #character {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 10px;
            position: absolute;
            left: 100px;
            top: 100px;
        }

        #coin {
            width: 30px;
            height: 30px;
            background: gold;
            border-radius: 50%;
            position: absolute;
            left: 500px;
            top: 300px;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 25px;
            font-weight: bold;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div id="game">

    <div id="score">Score: 0</div>

    <div id="character"></div>

    <div id="apple"></div>

</div>

<script src="iindex.js"></script>

</body>
</html>
